<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Big KJC Stake V4</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #050505;
      color: #ffd700;
      font-family: Arial, sans-serif;
      padding: 18px 12px 40px;
    }
    .wrap {
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
    }
    .card {
      background: #0d0d0d;
      border: 2px solid #8f6f10;
      border-radius: 22px;
      padding: 20px 16px;
      margin-bottom: 16px;
      box-shadow: 0 0 18px rgba(255,215,0,0.08);
    }
    h1, h2, h3 {
      margin: 0 0 14px;
      text-align: center;
      color: #ffd700;
      line-height: 1.2;
    }
    h1 { font-size: 38px; }
    h2 { font-size: 28px; }
    h3 { font-size: 24px; }

    .good { color: #92ff92; }
    .bad { color: #ff7d7d; }

    .wallet-box, .line, .stake-box, .grid-box {
      font-size: 21px;
      line-height: 1.55;
      word-break: break-word;
    }

    .wallet-box, .line {
      text-align: center;
      margin: 8px 0;
    }

    .btn {
      width: 100%;
      min-height: 58px;
      border: none;
      border-radius: 15px;
      background: #ffd700;
      color: #111;
      font-size: 22px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
    }

    .dash {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .grid-box {
      background: #151515;
      border: 1px solid #6f5710;
      border-radius: 16px;
      padding: 14px;
      text-align: center;
    }

    .dash-title {
      color: #cfb85b;
      font-size: 16px;
      margin-bottom: 6px;
    }

    .dash-value {
      font-size: 23px;
      font-weight: 700;
    }

    .stake-box {
      background: #151515;
      border: 1px solid #6f5710;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .stake-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .stake-actions {
      margin-top: 12px;
    }

    .sub {
      font-size: 17px;
      text-align: center;
      color: #d4bd62;
      margin-top: 8px;
    }

    @media (max-width: 640px) {
      h1 { font-size: 32px; }
      h2 { font-size: 25px; }
      h3 { font-size: 22px; }
      .wallet-box, .line, .stake-box, .grid-box { font-size: 18px; }
      .dash { grid-template-columns: 1fr 1fr; }
      .btn-row { grid-template-columns: 1fr; }
      .btn { font-size: 20px; }
      .dash-value { font-size: 20px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Big KJC Stake V4</h1>
      <div id="wallet" class="wallet-box bad">❌ Wallet not connected</div>
      <button id="btnConnect" class="btn">Connect Wallet</button>
    </div>

    <div class="card">
      <h2>Dashboard</h2>
      <div class="dash">
        <div class="grid-box">
          <div class="dash-title">Detected Token</div>
          <div id="detectedToken" class="dash-value">-</div>
        </div>
        <div class="grid-box">
          <div class="dash-title">Wallet Balance</div>
          <div id="walletBalance" class="dash-value">-</div>
        </div>
        <div class="grid-box">
          <div class="dash-title">Allowance</div>
          <div id="walletAllowance" class="dash-value">-</div>
        </div>
        <div class="grid-box">
          <div class="dash-title">Total Your Stakes</div>
          <div id="yourStakeCount" class="dash-value">0</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Auto Stake MAX</h2>
      <div id="token" class="line">Token : -</div>
      <div id="balance" class="line">Balance : -</div>
      <div id="allowance" class="line">Allowance : -</div>
      <div class="sub">ระบบจะเลือก KJC ใหม่ก่อน ถ้าไม่มีค่อยใช้ KJC เก่า</div>

      <div class="btn-row">
        <button id="btnApprove" class="btn">Approve</button>
        <button id="btnStake" class="btn">Stake MAX</button>
      </div>
    </div>

    <div class="card">
      <h3>Your Stakes</h3>
      <div id="stakes">Connect wallet first</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/web3@1.10.4/dist/web3.min.js"></script>
  <script src="config.js"></script>
  <script src="abi.js"></script>

  <script>
    let web3;
    let account = null;
    let provider = null;

    let staking;
    let oldToken;
    let newToken;

    let isConnecting = false;
    let isApproving = false;
    let isStaking = false;
    let refreshTimer = null;
    let lastRenderedStakesHTML = "";

    function pickProvider() {
      const bitkeep = window.bitkeep?.ethereum || window.bitkeep || null;
      const eth = window.ethereum || null;

      if (bitkeep?.request) return bitkeep;

      if (eth?.providers && Array.isArray(eth.providers)) {
        const bitgetProvider = eth.providers.find(
          (p) => p?.isBitKeep || p?.isBitgetWallet || p?.isBitget
        );
        if (bitgetProvider?.request) return bitgetProvider;

        const metaMaskProvider = eth.providers.find((p) => p?.isMetaMask);
        if (metaMaskProvider?.request) return metaMaskProvider;
      }

      if (eth?.request) return eth;
      return null;
    }

    function setWallet(text, ok = false) {
      const el = document.getElementById("wallet");
      if (!el) return;
      el.innerHTML = text;
      el.className = ok ? "wallet-box good" : "wallet-box bad";
    }

    function setTokenInfo(tokenText, balanceText, allowanceText = "Allowance : -") {
      const tokenEl = document.getElementById("token");
      const balEl = document.getElementById("balance");
      const allowanceEl = document.getElementById("allowance");

      if (tokenEl) tokenEl.innerHTML = tokenText;
      if (balEl) balEl.innerHTML = balanceText;
      if (allowanceEl) allowanceEl.innerHTML = allowanceText;
    }

    function setButtonState(id, disabled, text = null) {
      const btn = document.getElementById(id);
      if (!btn) return;
      btn.disabled = disabled;
      if (text !== null) btn.innerText = text;
    }

    function fmt(value, decimals = 18, maxFrac = 6) {
      const s = String(value || "0");
      const padded = s.padStart(decimals + 1, "0");
      const intPart = padded.slice(0, -decimals);
      let fracPart = padded.slice(-decimals).replace(/0+$/, "");
      if (fracPart.length > maxFrac) fracPart = fracPart.slice(0, maxFrac);
      return fracPart ? `${intPart}.${fracPart}` : intPart;
    }

    function secondsToDhms(sec) {
      sec = Number(sec);
      if (sec <= 0) return "พร้อมถอน";
      const d = Math.floor(sec / 86400);
      const h = Math.floor((sec % 86400) / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      return `${d}d ${h}h ${m}m ${s}s`;
    }

    async function ensureChain() {
      if (!provider?.request) throw new Error("No provider");

      const currentChainId = await provider.request({ method: "eth_chainId" });
      const targetHex = "0x" + Number(chainId).toString(16);

      if (String(currentChainId).toLowerCase() === targetHex.toLowerCase()) return;

      try {
        await provider.request({
          method: "wallet_switchEthereumChain",
          params: [{ chainId: targetHex }]
        });
      } catch (e) {
        if (e?.code === 4902) {
          await provider.request({
            method: "wallet_addEthereumChain",
            params: [{
              chainId: targetHex,
              chainName: "BNB Smart Chain",
              nativeCurrency: { name: "BNB", symbol: "BNB", decimals: 18 },
              rpcUrls: ["https://bsc-dataseed.binance.org/"],
              blockExplorerUrls: ["https://bscscan.com/"]
            }]
          });

          await provider.request({
            method: "wallet_switchEthereumChain",
            params: [{ chainId: targetHex }]
          });
          return;
        }
        throw e;
      }
    }

    async function initContracts() {
      web3 = new Web3(provider);
      staking = new web3.eth.Contract(stakingABI, contractAddress);
      oldToken = new web3.eth.Contract(erc20ABI, oldTokenAddress);
      newToken = new web3.eth.Contract(erc20ABI, newTokenAddress);
    }

    async function tryRestoreConnection() {
      try {
        if (!provider?.request) return;

        const accounts = await provider.request({ method: "eth_accounts" });
        if (!accounts?.length) {
          setButtonState("btnConnect", false, "Connect Wallet");
          return;
        }

        account = accounts[0];
        await ensureChain();
        await initContracts();

        setWallet("✅ Connected<br>" + account, true);
        setButtonState("btnConnect", false, "Connect Wallet");

        await refreshAll();
        startAutoRefresh();
      } catch (e) {
        console.error("tryRestoreConnection error:", e);
        setButtonState("btnConnect", false, "Connect Wallet");
      }
    }

    async function initApp() {
      try {
        provider = pickProvider();

        if (!provider?.request) {
          setWallet("❌ ไม่พบ Wallet Provider<br>กรุณาเปิดผ่าน Bitget / MetaMask DApp Browser");
          return;
        }

        await initContracts();

        document.getElementById("btnConnect")?.addEventListener("click", connectWallet);
        document.getElementById("btnApprove")?.addEventListener("click", approveOnly);
        document.getElementById("btnStake")?.addEventListener("click", stakeOnly);

        provider.on?.("accountsChanged", async (accounts) => {
          try {
            if (accounts?.length) {
              account = accounts[0];
              await ensureChain();
              await initContracts();
              setWallet("✅ Connected<br>" + account, true);
              await refreshAll();
              startAutoRefresh();
            } else {
              account = null;
              stopAutoRefresh();
              lastRenderedStakesHTML = "";
              setWallet("❌ Wallet not connected");
              setTokenInfo("Token : -", "Balance : -", "Allowance : -");
              document.getElementById("stakes").innerHTML = "Connect wallet first";
              document.getElementById("detectedToken").innerText = "-";
              document.getElementById("walletBalance").innerText = "-";
              document.getElementById("walletAllowance").innerText = "-";
              document.getElementById("yourStakeCount").innerText = "0";
              setButtonState("btnApprove", true, "Approve");
              setButtonState("btnStake", true, "Stake MAX");
              setButtonState("btnConnect", false, "Connect Wallet");
            }
          } catch (e) {
            console.error("accountsChanged error:", e);
            setButtonState("btnConnect", false, "Connect Wallet");
          }
        });

        provider.on?.("chainChanged", async () => {
          try {
            await ensureChain();
            await initContracts();
            if (account) await refreshAll();
          } catch (e) {
            console.error("chainChanged error:", e);
          }
        });

        await tryRestoreConnection();
      } catch (e) {
        console.error("initApp error:", e);
        setWallet("❌ Init failed: " + (e?.message || e));
        setButtonState("btnConnect", false, "Connect Wallet");
      }
    }

    function startAutoRefresh() {
      stopAutoRefresh();
      refreshTimer = setInterval(async () => {
        if (account) {
          try {
            await loadData(true);
          } catch (e) {
            console.error("auto refresh error:", e);
          }
        }
      }, 3000);
    }

    function stopAutoRefresh() {
      if (refreshTimer) clearInterval(refreshTimer);
      refreshTimer = null;
    }

    window.addEventListener("load", initApp);

    async function connectWallet() {
      if (isConnecting) return;

      try {
        isConnecting = true;
        setButtonState("btnConnect", true, "Connecting...");

        provider = pickProvider();
        if (!provider?.request) throw new Error("No provider");

        let accounts = await provider.request({ method: "eth_accounts" });
        if (!accounts || !accounts.length) {
          accounts = await provider.request({ method: "eth_requestAccounts" });
        }

        if (!accounts?.length) throw new Error("No account");

        account = accounts[0];
        await ensureChain();
        await initContracts();

        setWallet("✅ Connected<br>" + account, true);

        await refreshAll();
        startAutoRefresh();
      } catch (e) {
        console.error("connectWallet error:", e);

        let msg = e?.message || String(e);
        if (e?.code === 4001) msg = "ผู้ใช้ยกเลิกการเชื่อมต่อ";
        if (e?.code === -32002) msg = "มีหน้าต่าง Wallet ค้างอยู่ กรุณาเปิด Wallet แล้วกดยืนยัน";

        setWallet("❌ Wallet not connected");
        alert("Connect failed: " + msg);
      } finally {
        isConnecting = false;
        setButtonState("btnConnect", false, "Connect Wallet");
      }
    }

    async function getPickedTokenState() {
      if (!account || !web3 || !oldToken || !newToken) return null;

      try {
        const [balanceNew, balanceOld] = await Promise.all([
          newToken.methods.balanceOf(account).call(),
          oldToken.methods.balanceOf(account).call()
        ]);

        if (web3.utils.toBN(balanceNew).gt(web3.utils.toBN("0"))) {
          const allowance = await newToken.methods.allowance(account, contractAddress).call();
          return {
            label: "KJC NEW",
            token: newToken,
            balance: balanceNew,
            allowance,
            stakeMethod: "stakeNew"
          };
        }

        if (web3.utils.toBN(balanceOld).gt(web3.utils.toBN("0"))) {
          const allowance = await oldToken.methods.allowance(account, contractAddress).call();
          return {
            label: "KJC OLD",
            token: oldToken,
            balance: balanceOld,
            allowance,
            stakeMethod: "stakeOld"
          };
        }

        return null;
      } catch (e) {
        console.error("getPickedTokenState error:", e);
        return null;
      }
    }

    function getUseAmount(balanceStr) {
      const balanceBN = web3.utils.toBN(balanceStr);
      return balanceBN.mul(web3.utils.toBN(999)).div(web3.utils.toBN(1000));
    }

    async function loadTokenPreview() {
      try {
        if (!account) {
          setTokenInfo("Token : -", "Balance : -", "Allowance : -");
          document.getElementById("detectedToken").innerText = "-";
          document.getElementById("walletBalance").innerText = "-";
          document.getElementById("walletAllowance").innerText = "-";
          return;
        }

        const picked = await getPickedTokenState();

        if (!picked) {
          setTokenInfo("Token : ไม่พบ KJC", "Balance : 0", "Allowance : 0");
          document.getElementById("detectedToken").innerText = "No KJC";
          document.getElementById("walletBalance").innerText = "0";
          document.getElementById("walletAllowance").innerText = "0";
          return;
        }

        setTokenInfo(
          "Token : " + picked.label,
          "Balance : " + fmt(picked.balance) + " KJC",
          "Allowance : " + fmt(picked.allowance) + " KJC"
        );

        document.getElementById("detectedToken").innerText = picked.label;
        document.getElementById("walletBalance").innerText = fmt(picked.balance) + " KJC";
        document.getElementById("walletAllowance").innerText = fmt(picked.allowance) + " KJC";
      } catch (e) {
        console.error("loadTokenPreview error:", e);
      }
    }

    async function updateButtons() {
      try {
        if (!account) {
          setButtonState("btnApprove", true, "Approve");
          setButtonState("btnStake", true, "Stake MAX");
          return;
        }

        const picked = await getPickedTokenState();

        if (!picked) {
          setButtonState("btnApprove", true, "No KJC Found");
          setButtonState("btnStake", true, "Stake MAX");
          return;
        }

        const useAmountBN = getUseAmount(picked.balance);
        const allowanceBN = web3.utils.toBN(picked.allowance);

        setButtonState("btnApprove", false, "Approve " + picked.label);

        if (allowanceBN.lt(useAmountBN)) {
          setButtonState("btnStake", true, "Stake MAX " + picked.label);
        } else {
          setButtonState("btnStake", false, "Stake MAX " + picked.label);
        }
      } catch (e) {
        console.error("updateButtons error:", e);
      }
    }

    async function approveOnly() {
      if (isApproving) return;

      try {
        if (!account) {
          alert("กรุณาเชื่อมต่อกระเป๋าก่อน");
          return;
        }

        isApproving = true;
        setButtonState("btnApprove", true, "Approving...");

        await ensureChain();

        const picked = await getPickedTokenState();
        if (!picked) {
          alert("ไม่พบยอด KJC เก่าหรือใหม่ในกระเป๋า");
          return;
        }

        const useAmountBN = getUseAmount(picked.balance);
        if (useAmountBN.lte(web3.utils.toBN("0"))) {
          alert("ยอดเหรียญไม่พอสำหรับ approve");
          return;
        }

        await picked.token.methods
          .approve(contractAddress, useAmountBN.toString())
          .send({ from: account });

        alert("✅ Approve สำเร็จ");
        await refreshAll();
      } catch (e) {
        console.error("approveOnly error:", e);

        let msg = e?.message || String(e);
        if (e?.code === 4001) msg = "ผู้ใช้ยกเลิก approve";
        alert("Approve failed: " + msg);
      } finally {
        isApproving = false;
        await updateButtons();
      }
    }

    async function stakeOnly() {
      if (isStaking) return;

      try {
        if (!account) {
          alert("กรุณาเชื่อมต่อกระเป๋าก่อน");
          return;
        }

        isStaking = true;
        setButtonState("btnStake", true, "Staking...");

        await ensureChain();

        const picked = await getPickedTokenState();
        if (!picked) {
          alert("ไม่พบยอด KJC เก่าหรือใหม่ในกระเป๋า");
          return;
        }

        const useAmountBN = getUseAmount(picked.balance);
        const allowanceBN = web3.utils.toBN(picked.allowance);

        if (useAmountBN.lte(web3.utils.toBN("0"))) {
          alert("ยอดเหรียญไม่พอสำหรับ stake");
          return;
        }

        if (allowanceBN.lt(useAmountBN)) {
          alert("Allowance ยังไม่พอ กรุณากด Approve ก่อน");
          return;
        }

        await staking.methods[picked.stakeMethod](useAmountBN.toString()).send({ from: account });

        alert("✅ Stake สำเร็จ");
        await refreshAll();
      } catch (e) {
        console.error("stakeOnly error:", e);
        let msg = e?.message || String(e);
        if (e?.code === 4001) msg = "ผู้ใช้ยกเลิก stake";
        alert("Stake failed: " + msg);
      } finally {
        isStaking = false;
        await updateButtons();
      }
    }

    async function refreshAll() {
      await loadTokenPreview();
      await loadData(false);
      await updateButtons();
    }

    async function loadData(isSilent = false) {
      const stakesDiv = document.getElementById("stakes");

      if (!account || !staking) {
        stakesDiv.innerHTML = "Connect wallet first";
        return;
      }

      if (!isSilent && !lastRenderedStakesHTML) {
        stakesDiv.innerHTML = "Loading...";
      }

      try {
        const countNew = Number(await staking.methods.getStakeCountNew(account).call());
        const countOld = Number(await staking.methods.getStakeCountOld(account).call());

        document.getElementById("yourStakeCount").innerText = String(countNew + countOld);

        let html = "";
        const now = Math.floor(Date.now() / 1000);

        for (let i = 0; i < countNew; i++) {
          const stake = await staking.methods.stakesNew(account, i).call();
          const unlock = await staking.methods.isUnlockedNew(account, i).call();
          const payout = await staking.methods.maturedPayoutNew(account, i).call();
          const unlockTime = await staking.methods.unlockTimeNew(account, i).call();

          const remaining = Number(unlockTime) - now;

          html += `
            <div class="stake-box">
              <div class="stake-title">NEW Stake ${i}</div>
              Amount: ${fmt(stake.amount)} KJC<br>
              Reward: ${fmt(payout.reward)} KJC<br>
              Total: ${fmt(payout.total)} KJC<br>
              Unlock Time: ${new Date(Number(unlockTime) * 1000).toLocaleString("th-TH")}<br>
              Countdown: ${secondsToDhms(remaining)}<br>
              Unlocked: ${unlock ? "Yes" : "No"}<br>
              <div class="stake-actions">
                ${unlock && !stake.unstaked ? `<button class="btn" onclick="unstakeNew(${i})">Withdraw NEW</button>` : ""}
              </div>
            </div>
          `;
        }

        for (let i = 0; i < countOld; i++) {
          const stake = await staking.methods.stakesOld(account, i).call();
          const unlock = await staking.methods.isUnlockedOld(account, i).call();
          const payout = await staking.methods.maturedPayoutOld(account, i).call();
          const unlockTime = await staking.methods.unlockTimeOld(account, i).call();

          const remaining = Number(unlockTime) - now;

          html += `
            <div class="stake-box">
              <div class="stake-title">OLD Stake ${i}</div>
              Amount: ${fmt(stake.amount)} KJC<br>
              Reward: ${fmt(payout.reward)} KJC<br>
              Total: ${fmt(payout.total)} KJC<br>
              Unlock Time: ${new Date(Number(unlockTime) * 1000).toLocaleString("th-TH")}<br>
              Countdown: ${secondsToDhms(remaining)}<br>
              Unlocked: ${unlock ? "Yes" : "No"}<br>
              <div class="stake-actions">
                ${unlock && !stake.unstaked ? `<button class="btn" onclick="unstakeOld(${i})">Withdraw OLD</button>` : ""}
              </div>
            </div>
          `;
        }

        const finalHTML = html || "No stakes";

        if (finalHTML !== lastRenderedStakesHTML) {
          stakesDiv.innerHTML = finalHTML;
          lastRenderedStakesHTML = finalHTML;
        }
      } catch (e) {
        console.error("loadData error:", e);
        if (!lastRenderedStakesHTML) {
          stakesDiv.innerHTML = "Load failed";
        }
      }
    }

    async function unstakeNew(i) {
      try {
        await ensureChain();
        await staking.methods.unstakeNew(i).send({ from: account });
        alert("Withdraw NEW success");
        await refreshAll();
      } catch (e) {
        console.error("unstakeNew error:", e);
        alert("Unstake NEW failed: " + (e?.message || e));
      }
    }

    async function unstakeOld(i) {
      try {
        await ensureChain();
        await staking.methods.unstakeOld(i).send({ from: account });
        alert("Unstake OLD failed: " + (e?.message || e));
      }
    }
  </script>
</body>
</html>
